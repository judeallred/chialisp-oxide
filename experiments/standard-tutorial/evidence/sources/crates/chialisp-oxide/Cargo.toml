[package]
name = "chialisp-oxide"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
alloc = []
# Native CLVM evaluation of `apply` for host tests and corpus oracles (std).
vm = ["dep:clvmr", "dep:chialisp-oxide-vm"]

[dependencies]
chialisp-oxide-macros = { path = "../chialisp-oxide-macros", version = "0.1.0" }
clvmr = { version = "=0.21.0", optional = true }
chialisp-oxide-vm = { path = "../chialisp-oxide-vm", version = "0.1.0", optional = true }

[dev-dependencies]
sha2 = "0.10"
clvm-utils = "=0.36.1"
# The oracle crate's own VM version, used only to build its input nodes.
oracle-clvmr = { package = "clvmr", version = "=0.16.2" }
