[package]
name = "cargo-chialisp-oxide"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
chialisp-oxide-package = { path = "../chialisp-oxide-package" }
chialisp-oxide-ir = { path = "../chialisp-oxide-ir" }
chialisp-oxide-backend-experiment = { path = "../../experiments/backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
