[package]
name = "chialisp-oxide-corpus"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
anyhow = "1"
chialisp-oxide-ir = { path = "../chialisp-oxide-ir" }
chialisp-oxide-puzzles = { path = "../../puzzles" }
chialisp-oxide = { path = "../chialisp-oxide", features = ["alloc", "vm"] }
chialisp-oxide-reference = { path = "../chialisp-oxide-reference" }
chialisp-oxide-rue = { path = "../chialisp-oxide-rue" }
chialisp-oxide-simulator = { path = "../chialisp-oxide-simulator" }
chialisp-oxide-vm = { path = "../chialisp-oxide-vm" }
chialisp-oxide-package = { path = "../chialisp-oxide-package" }
chia-bls = "=0.36.1"
chia-puzzle-types = "=0.36.1"
chia-puzzles = "=0.20.3"
chia-sdk-types = { version = "=0.36.0", features = ["action-layer"] }
clvm-traits = { version = "=0.36.1", features = ["derive"] }
clvm-utils = "=0.36.1"
clvmr-sdk = { package = "clvmr", version = "=0.16.2" }
chialisp-oxide-backend-experiment = { path = "../../experiments/backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
clvmr = "=0.21.0"
hex = "0.4"
sha2 = "0.10"
bumpalo = "3"
rue-clvm = { git = "https://github.com/xch-dev/rue", rev = "245c107a8e795229ea08097142f005a4c0d91075" }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
