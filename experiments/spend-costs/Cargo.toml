[package]
name = "chialisp-oxide-spend-costs"
version = "0.1.0"
edition = "2024"
publish = false

# Keep measurement separate from the compiler and its historical source windows.
[workspace]

[dependencies]
anyhow = "1"
chia-bls = "=0.36.1"
chia-consensus = "=0.36.1"
chia-sdk-types = "=0.36.0"
chialisp-oxide-simulator = { path = "../../crates/chialisp-oxide-simulator" }
clvmr = "=0.16.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chialisp-oxide-reference = { path = "../../crates/chialisp-oxide-reference" }
