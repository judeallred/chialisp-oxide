[package]
name = "chialisp-oxide-package"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clvmr = "=0.21.0"
chialisp-oxide-ir = { path = "../chialisp-oxide-ir" }
chia-bls = "=0.36.1"
chia-puzzle-types = "=0.36.1"
chia-puzzles = "=0.20.3"
clvm-traits = "=0.36.1"
clvm-utils = "=0.36.1"
clvmr-sdk = { package = "clvmr", version = "=0.16.2" }
[dev-dependencies]
tempfile = "3"
chialisp-oxide-vm = { path = "../chialisp-oxide-vm" }
chia-protocol = "=0.36.1"
chia-sdk-types = "=0.36.0"
