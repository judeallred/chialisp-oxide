[package]
name = "chialisp-oxide-lifecycle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chia-bls = "=0.36.1"
chia-protocol = "=0.36.1"
chia-traits = "=0.36.1"
chialisp-oxide-package = { path = "../chialisp-oxide-package" }
chialisp-oxide = { path = "../chialisp-oxide" }
chialisp-oxide-lifecycle-payment = { path = "recipe" }
chialisp-oxide-ir = { path = "../chialisp-oxide-ir" }
chialisp-oxide-reference = { path = "../chialisp-oxide-reference" }
chialisp-oxide-vm = { path = "../chialisp-oxide-vm" }
clvmr = "=0.21.0"
libc = "0.2"
chialisp-oxide-puzzles = { path = "../../puzzles" }
chialisp-oxide-simulator = { path = "../chialisp-oxide-simulator" }
chia-consensus = "=0.36.1"
chia-sdk-types = "=0.36.0"
hex = "0.4"
bytes = "=1.12.1"
getrandom = { version = "=0.4.3", features = ["std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
subtle = "=2.6.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
hyper = { version = "=1.11.1", features = ["client", "http1"] }

