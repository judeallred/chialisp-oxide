[package]
name = "chialisp-oxide-verifier"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "chialisp-oxide-verifier"

[dependencies]
chialisp-oxide-vm = { path = "../chialisp-oxide-vm" }
anyhow = "1"
num-bigint = "0.4"
chialisp-oxide-ir = { path = "../chialisp-oxide-ir" }
chialisp-oxide-reference = { path = "../chialisp-oxide-reference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clvmr = "=0.21.0"
