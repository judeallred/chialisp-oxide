name: Compiler and verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install checksum-pinned Z3 4.15.4
        run: |
          z3_archive="$RUNNER_TEMP/z3-4.15.4-x64-glibc-2.39.zip"
          z3_directory="$RUNNER_TEMP/z3-4.15.4-x64-glibc-2.39"
          curl --fail --location --retry 3 --output "$z3_archive" https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-glibc-2.39.zip
          printf '%s  %s\n' 'a41b690e89c343931471506cdc6d957b6044a200fd2d240cc017432afdff7d3e' "$z3_archive" | sha256sum --check --strict
          python3 - "$z3_archive" "$RUNNER_TEMP" <<'PYTHON'
          from pathlib import Path
          import sys
          import zipfile
          destination = Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(destination)
          binary = destination / "z3-4.15.4-x64-glibc-2.39/bin/z3"
          if not binary.is_file():
              raise RuntimeError("The pinned Z3 archive is missing its CLI binary")
          binary.chmod(0o755)
          PYTHON
          z3_version="$("$z3_directory/bin/z3" --version)"
          printf '%s\n' "$z3_version"
          test "$z3_version" = 'Z3 version 4.15.4 - 64 bit'
          printf '%s\n' "$z3_directory/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust and compiler components
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Populate dependencies for fresh offline Cargo consumers
        run: |
          # These disposable consumers resolve separately from the workspace lock.
          # Populate their registry cache before the actual offline evidence/tests.
          python3 -B scripts/run-precommit-source-controls.py prepare \
            --package "$RUNNER_TEMP/offline-consumer-dependencies" \
            --receipt "$RUNNER_TEMP/offline-consumer-dependencies-prepare.json"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/offline-consumer-dependencies/Cargo.toml"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/offline-consumer-dependencies/Cargo.toml"
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - name: Check retained delegated policy source controls
        run: python3 scripts/check-p2dc-source-controls.py corpus/p2dc-source-controls/report.json --self-test
      - name: Prepare and natively check fresh delegated policy mutations
        run: |
          python3 scripts/run-p2dc-source-controls.py prepare \
            --package "$RUNNER_TEMP/p2dc-source-package" \
            --receipt "$RUNNER_TEMP/p2dc-source-prepare.json"
          python3 scripts/run-p2dc-source-controls.py native \
            --package "$RUNNER_TEMP/p2dc-source-package" \
            --prepared "$RUNNER_TEMP/p2dc-source-prepare.json" \
            --target "$RUNNER_TEMP/p2dc-source-native-target" \
            --output "$RUNNER_TEMP/p2dc-source-native"
      - name: Finish host tools before delegated source-control extraction
        run: |
          cargo build --workspace --bins --examples --locked --target-dir "$GITHUB_WORKSPACE/target"
          python3 scripts/record-controls-quiet-window.py --kind p2dc \
            --package "$RUNNER_TEMP/p2dc-source-package" \
            --native-receipt "$RUNNER_TEMP/p2dc-source-native/native-receipt.json" \
            --output "$RUNNER_TEMP/p2dc-source-last-host.json"
      - name: Capture and check fresh Linux delegated source controls
        run: |
          # Fresh Linux host metadata remains separate from the retained macOS packet.
          python3 scripts/run-p2dc-source-controls.py capture \
            --package "$RUNNER_TEMP/p2dc-source-package" \
            --native-receipt "$RUNNER_TEMP/p2dc-source-native/native-receipt.json" \
            --last-host-window "$RUNNER_TEMP/p2dc-source-last-host.json" \
            --target "$GITHUB_WORKSPACE/target" \
            --output "$RUNNER_TEMP/p2dc-source-capture"
          python3 scripts/check-p2dc-source-controls.py "$RUNNER_TEMP/p2dc-source-capture/report.json" --self-test
      - name: Prepare and natively check fresh boomerang source mutations
        run: |
          python3 scripts/run-boomerang-source-controls.py prepare \
            --package "$RUNNER_TEMP/boomerang-source-package" --receipt "$RUNNER_TEMP/boomerang-source-prepare.json"
          python3 scripts/run-boomerang-source-controls.py native \
            --package "$RUNNER_TEMP/boomerang-source-package" --prepared "$RUNNER_TEMP/boomerang-source-prepare.json" \
            --target "$RUNNER_TEMP/boomerang-source-native-target" --output "$RUNNER_TEMP/boomerang-source-native"
      - name: Finish host tools before boomerang source-control extraction
        run: |
          cargo build --workspace --bins --examples --locked
          python3 scripts/record-controls-quiet-window.py --kind boomerang \
            --package "$RUNNER_TEMP/boomerang-source-package" \
            --native-receipt "$RUNNER_TEMP/boomerang-source-native/native-receipt.json" \
            --output "$RUNNER_TEMP/boomerang-source-last-host.json"
      - name: Capture fresh Linux boomerang source controls
        run: |
          python3 scripts/run-boomerang-source-controls.py capture \
            --package "$RUNNER_TEMP/boomerang-source-package" \
            --native-receipt "$RUNNER_TEMP/boomerang-source-native/native-receipt.json" \
            --last-host-window "$RUNNER_TEMP/boomerang-source-last-host.json" \
            --target "$GITHUB_WORKSPACE/target" --output "$RUNNER_TEMP/boomerang-source-capture"
      - name: Execute actual SDK SHA against native known answers and OpenSSL
        run: |
          python3 experiments/hash-native/check-native.py --work-dir "$RUNNER_TEMP/hash-native-work" --output "$RUNNER_TEMP/hash-native.json" --self-test
          python3 experiments/hash-native/check-native.py --output "$RUNNER_TEMP/hash-native.json" --check --self-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boomerang-source-controls-linux
          path: |
            ${{ runner.temp }}/boomerang-source-package/
            ${{ runner.temp }}/boomerang-source-prepare.json
            ${{ runner.temp }}/boomerang-source-native/
            ${{ runner.temp }}/boomerang-source-last-host.json
            ${{ runner.temp }}/boomerang-source-capture/
      - name: Check VM failure and consensus rejection protocols
        run: |
          python3 scripts/vm_failures.py
          python3 scripts/ledger_rejections.py
      - run: python3 corpus/validate_inventory.py
      - name: Check published puzzle discovery and provenance controls
        run: python3 corpus/validate_published_puzzles.py --self-test
      - name: Reproduce compiler error studies and missed-test counterexamples
        run: |
          python3 scripts/check-error-study.py
          python3 scripts/check-error-study.py --self-test
      - name: Check pinned tutorial examples and inventory controls
        run: |
          python3 corpus/validate_tutorial_examples.py
          python3 corpus/validate_tutorial_examples.py --self-test
      - run: python3 scripts/check-proofs.py
      - name: Check canonical integer byte model and counterexamples
        run: |
          python3 -m unittest discover -s scripts -p test_integer_canonicality.py
          python3 scripts/check-integer-canonicality.py --check --self-test
      - name: Derive and check proofs from Rust source
        run: |
          python3 scripts/check-ir-proofs.py --output corpus/proofs.json
          python3 scripts/check-ir-proofs.py --self-test
      - name: Check structural raw-tree specification and replay mutants
        run: |
          python3 scripts/check-tree-proofs.py --output corpus/tree-proofs.json
          python3 scripts/check-tree-proofs.py --self-test
      - name: Validate Rust, Chialisp, native execution, and complete spends reproducibly
        run: |
          target/debug/chialisp-oxide validate --output corpus/validation.json
          target/debug/chialisp-oxide validate --output "$RUNNER_TEMP/validation-repeat.json"
          cmp corpus/validation.json "$RUNNER_TEMP/validation-repeat.json"
      - name: Check boomerang policy, retained bytes and both source-mutant packets
        run: |
          python3 scripts/check-boomerang.py --self-test --replay --source-controls corpus/boomerang-source-controls/report.json
          python3 scripts/check-boomerang.py --source-controls "$RUNNER_TEMP/boomerang-source-capture/report.json"
      - name: Check precommit policies and retained actual-source controls
        run: python3 scripts/check-precommit.py --self-test --replay
      - name: Prepare and natively check fresh precommit mutations
        run: |
          python3 scripts/run-precommit-source-controls.py prepare --package "$RUNNER_TEMP/precommit-source-package" --receipt "$RUNNER_TEMP/precommit-source-prepare.json"
          python3 scripts/run-precommit-source-controls.py native --package "$RUNNER_TEMP/precommit-source-package" --prepared "$RUNNER_TEMP/precommit-source-prepare.json" --target "$RUNNER_TEMP/precommit-source-native-target" --output "$RUNNER_TEMP/precommit-source-native"
      - name: Finish host tools before precommit source-control extraction
        run: |
          cargo build --workspace --bins --examples --locked
          python3 scripts/record-controls-quiet-window.py --kind precommit --package "$RUNNER_TEMP/precommit-source-package" --native-receipt "$RUNNER_TEMP/precommit-source-native/native-receipt.json" --output "$RUNNER_TEMP/precommit-source-last-host.json"
      - name: Capture fresh Linux precommit source controls
        run: |
          python3 scripts/run-precommit-source-controls.py capture --package "$RUNNER_TEMP/precommit-source-package" --native-receipt "$RUNNER_TEMP/precommit-source-native/native-receipt.json" --last-host-window "$RUNNER_TEMP/precommit-source-last-host.json" --target "$GITHUB_WORKSPACE/target" --output "$RUNNER_TEMP/precommit-source-capture"
          python3 scripts/check-precommit.py --source-controls-only --source-controls "$RUNNER_TEMP/precommit-source-capture/report.json" --replay
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: precommit-source-controls-linux
          path: |
            ${{ runner.temp }}/precommit-source-package/
            ${{ runner.temp }}/precommit-source-prepare.json
            ${{ runner.temp }}/precommit-source-native/
            ${{ runner.temp }}/precommit-source-last-host.json
            ${{ runner.temp }}/precommit-source-capture/
      - name: Check retained CAT source controls and bounded capture transport
        run: |
          python3 -m unittest discover -s scripts -p test_cat_source_controls.py
          python3 -B experiments/cat-genesis-tail/test_rust_capture.py
          python3 scripts/check-cat-source-controls.py --self-test
      - name: Prepare and natively check fresh CAT source mutations
        run: |
          # Full offline metadata admits every target's dependency graph,
          # including sources a host-only workspace build never downloads.
          cargo fetch --locked
          cargo fetch --locked --manifest-path experiments/cat-genesis-tail/Cargo.toml
          python3 -B experiments/cat-genesis-tail/rust_capture.py prepare --output "$RUNNER_TEMP/cat-source-capture" --native-target "$GITHUB_WORKSPACE/target"
          python3 -B experiments/cat-genesis-tail/rust_capture.py native --output "$RUNNER_TEMP/cat-source-capture" --native-target "$GITHUB_WORKSPACE/target"
      - name: Finish host tools before CAT source-control extraction
        run: cargo build --workspace --bins --examples --locked
      - name: Execute fresh Linux CAT source controls and exact repeat
        run: |
          python3 -B experiments/cat-genesis-tail/rust_capture.py extract --output "$RUNNER_TEMP/cat-source-capture" --native-target "$GITHUB_WORKSPACE/target" --compiler-target "$GITHUB_WORKSPACE/target" --compiler-root "$GITHUB_WORKSPACE" --driver "$GITHUB_WORKSPACE/target/debug/chialisp-oxide-driver" --registry-cli "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide" --cli "$GITHUB_WORKSPACE/target/debug/chialisp-oxide"
          python3 -B experiments/cat-genesis-tail/rust_capture.py execute --output "$RUNNER_TEMP/cat-source-capture" --native-target "$GITHUB_WORKSPACE/target"
          python3 scripts/check-cat-source-controls.py --install-capture "$RUNNER_TEMP/cat-source-capture" --packet "$RUNNER_TEMP/cat-source-packet" --self-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cat-source-controls-linux
          path: |
            ${{ runner.temp }}/cat-source-capture/
            ${{ runner.temp }}/cat-source-packet/
      - name: Check counter journals, canonical provenance and retained source controls
        run: |
          python3 -B scripts/counter_protocol.py --self-test
          python3 -B -m unittest discover -s scripts -p test_counter_protocol.py
          python3 -B -m unittest discover -s scripts -p test_action_counter_packet.py
          python3 -B -m unittest discover -s experiments/action-counter -p 'test_*.py'
          python3 -B scripts/check-action-counter.py --self-test --replay
      - name: Prepare and natively check fresh counter source mutations
        run: |
          cargo fetch --locked --manifest-path experiments/action-counter/Cargo.toml
          counter_args=(--output "$RUNNER_TEMP/counter-source-capture" --native-target "$GITHUB_WORKSPACE/target/action-counter-native" --compiler-target "$GITHUB_WORKSPACE/target" --compiler-root "$GITHUB_WORKSPACE" --rustc "$(rustup which --toolchain nightly-2026-07-14 rustc)" --driver "$GITHUB_WORKSPACE/target/debug/chialisp-oxide-driver" --cargo-cli "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide")
          python3 -B experiments/action-counter/capture.py prepare "${counter_args[@]}"
          python3 -B experiments/action-counter/capture.py native "${counter_args[@]}"
      - name: Finish host tools before counter source-control extraction
        run: cargo build --workspace --bins --examples --locked
      - name: Execute fresh Linux counter sources, five-build lifecycle and exact repeats
        run: |
          counter_args=(--output "$RUNNER_TEMP/counter-source-capture" --native-target "$GITHUB_WORKSPACE/target/action-counter-native" --compiler-target "$GITHUB_WORKSPACE/target" --compiler-root "$GITHUB_WORKSPACE" --rustc "$(rustup which --toolchain nightly-2026-07-14 rustc)" --driver "$GITHUB_WORKSPACE/target/debug/chialisp-oxide-driver" --cargo-cli "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide")
          python3 -B experiments/action-counter/capture.py extract "${counter_args[@]}"
          python3 -B experiments/action-counter/capture.py replay "${counter_args[@]}"
          python3 -B experiments/action-counter/protocol_capture.py run --protocol-output "$RUNNER_TEMP/counter-protocol-capture" "${counter_args[@]}"
          python3 -B scripts/check-action-counter.py --install "$RUNNER_TEMP/counter-source-packet" --raw-capture "$RUNNER_TEMP/counter-source-capture" --protocol-capture "$RUNNER_TEMP/counter-protocol-capture" --self-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: counter-source-controls-linux
          path: |
            ${{ runner.temp }}/counter-source-capture/
            ${{ runner.temp }}/counter-protocol-capture/
            ${{ runner.temp }}/counter-source-packet/
      - name: Check registry slots and retained Rust omission controls
        run: |
          python3 -B scripts/registry_protocol.py --report corpus/validation.json --self-test
          python3 -B -m unittest discover -s scripts -p 'test_registry*.py'
          python3 -B scripts/check-registry-source-controls.py --packet corpus/registry-source-controls --report corpus/validation.json --self-test --replay --cli target/debug/chialisp-oxide
      - name: Execute fresh Linux registry Rust source controls and repeats
        run: |
          registry_work="$GITHUB_WORKSPACE/target/registry-source-linux-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B scripts/run-registry-source-controls.py native --execute --target "$GITHUB_WORKSPACE/target/registry-controls-native" --output "$registry_work/native"
          python3 -B scripts/run-registry-source-controls.py last --execute --target "$GITHUB_WORKSPACE/target" --native-dir "$registry_work/native" --output "$registry_work/last"
          target/debug/chialisp-oxide validate --only registry-initialize,registry-set-alpha,registry-set-beta --output "$registry_work/base/report.json"
          python3 -B scripts/run-registry-source-controls.py capture --execute --native-dir "$registry_work/native" --last-dir "$registry_work/last" --base-report "$registry_work/base/report.json" --output "$registry_work/capture"
          python3 -B scripts/check-registry-source-controls.py --install-capture "$registry_work/capture" --native-dir "$registry_work/native" --last-dir "$registry_work/last" --base-dir "$registry_work/base" --packet "$registry_work/packet" --report corpus/validation.json --self-test --replay --cli target/debug/chialisp-oxide
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-source-controls-linux
          path: |
            target/registry-source-linux-${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Check canonical pay-to-singleton and actual Rust policy mutations
        run: |
          python3 -m unittest discover -s scripts -p test_p2_append_migration.py
          python3 -m unittest discover -s scripts -p test_p2_singleton_evidence.py
          python3 -m unittest discover -s scripts -p test_p2_outer_integration.py
          python3 scripts/check-p2-singleton.py --self-test
          cargo test --manifest-path experiments/p2-singleton-controls/Cargo.toml --locked
          cargo clippy --manifest-path experiments/p2-singleton-controls/Cargo.toml --all-targets --locked -- -D warnings
          cargo build -p chialisp-oxide-corpus --examples --locked
          target/debug/cargo-chialisp-oxide build --locked --manifest-path experiments/p2-singleton-controls/Cargo.toml --output-dir "$RUNNER_TEMP/p2-policy-controls"
          python3 scripts/check-p2-source-controls.py --bundle "$RUNNER_TEMP/p2-policy-controls" --driver target/debug/chialisp-oxide-driver --self-test
          target/debug/examples/p2_singleton_controls "$RUNNER_TEMP/p2-policy-controls" "$RUNNER_TEMP/p2-policy-controls.json"
      - name: Extract fresh complete Cargo bundles in both modes
        run: |
          target/debug/cargo-chialisp-oxide build --manifest-path puzzles/Cargo.toml --package chialisp-oxide-puzzles --locked --output-dir "$RUNNER_TEMP/puzzles-on"
          target/debug/cargo-chialisp-oxide build --manifest-path puzzles/Cargo.toml --package chialisp-oxide-puzzles --locked --no-optimize --output-dir "$RUNNER_TEMP/puzzles-off"
      - name: Execute exact registry dependencies with the Rust host consumer
        run: |
          python3 scripts/check-registry-dependencies.py --cli target/debug/cargo-chialisp-oxide --consumer target/debug/examples/locked-artifact --bundle-on "$RUNNER_TEMP/puzzles-on" --bundle-off "$RUNNER_TEMP/puzzles-off" --output "$RUNNER_TEMP/registry-dependencies"
      - name: Execute the retrieved standard binding around Rust inner programs
        run: |
          python3 scripts/check-registry-standard.py --cli target/debug/cargo-chialisp-oxide --consumer target/debug/examples/locked-standard --bundle-on "$RUNNER_TEMP/puzzles-on" --bundle-off "$RUNNER_TEMP/puzzles-off" --output "$RUNNER_TEMP/registry-standard"
      - name: Generate and compile exact locked local Rust helpers
        run: |
          python3 -m unittest discover -s scripts -p test_registry_codegen_evidence.py
          python3 scripts/check-registry-codegen.py --execute --output "$RUNNER_TEMP/registry-codegen"
      - name: Generate and validate explicit program-witness Rust helpers
        run: |
          python3 -m unittest discover -s scripts -p test_registry_witness_evidence.py
          python3 scripts/check-registry-witness.py --execute --output "$RUNNER_TEMP/registry-witness"
      - name: Spend through the retrieved standard module from a Cargo Rust wrapper
        run: |
          python3 examples/registry-standard-wallet/check.py --self-test
          python3 examples/registry-standard-wallet/prepare.py --registry-cli "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide" --output "$RUNNER_TEMP/registry-standard-wallet"
          python3 examples/registry-standard-wallet/check.py --execute --output "$RUNNER_TEMP/registry-standard-wallet" --registry-cli "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide" --driver "$GITHUB_WORKSPACE/target/debug/chialisp-oxide-driver"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-standard-wallet
          path: |
            ${{ runner.temp }}/registry-standard-wallet/
            !${{ runner.temp }}/registry-standard-wallet/project/target/**
      - name: Execute fresh local lifecycle and resume through the shared core
        run: |
          pinned_cargo=$(rustup which --toolchain nightly-2026-07-14 cargo)
          destination=2323232323232323232323232323232323232323232323232323232323232323
          target/debug/chialisp-oxide-lifecycle fresh run \
            --cargo "$pinned_cargo" --compiler "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide" \
            --destination-hex "$destination" --mode on \
            --output "$RUNNER_TEMP/lifecycle-check-1" --journal "$RUNNER_TEMP/payment.lifecycle.json" \
            --steps 3 > "$RUNNER_TEMP/lifecycle-partial.json"
          target/debug/chialisp-oxide-lifecycle fresh resume \
            --cargo "$pinned_cargo" --compiler "$GITHUB_WORKSPACE/target/debug/cargo-chialisp-oxide" \
            --destination-hex "$destination" --mode on \
            --output "$RUNNER_TEMP/lifecycle-check-2" --journal "$RUNNER_TEMP/payment.lifecycle.json" \
            > "$RUNNER_TEMP/lifecycle-complete.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          partial = json.loads((root / 'lifecycle-partial.json').read_text())
          complete = json.loads((root / 'lifecycle-complete.json').read_text())
          assert partial['stage'] == 'awaiting_signature' and partial['revision'] == 3
          assert complete['stage'] == 'confirmed' and complete['revision'] == 7
          assert complete['instance_tree_hash'] == partial['instance_tree_hash']
          assert complete['recipe_scope']['mode'] == 'rust_on'
          assert complete['checks']['fresh_cargo_build'] == 'executed_this_process'
          assert complete['checks']['live_network'] == 'unavailable'
          assert complete['input_coin'] == partial['input_coin']
          assert complete['input_coin']['coin']['amount'] == 1000
          assert len(complete['children']) == 1
          child = complete['children'][0]
          assert child['coin']['amount'] == 1000 and child['coin']['puzzle_hash'] == [0x23] * 32
          assert bytes(child['coin']['parent']).hex() == complete['input_coin']['coin_id']
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-lifecycle
          path: |
            ${{ runner.temp }}/lifecycle-check-*/
            !${{ runner.temp }}/lifecycle-check-*/native-target/**
            !${{ runner.temp }}/lifecycle-check-*/compiler-target/**
            ${{ runner.temp }}/lifecycle-partial.json
            ${{ runner.temp }}/lifecycle-complete.json
            ${{ runner.temp }}/payment.lifecycle.json
      - name: Execute P2 raw-domain and separate resource controls
        run: |
          p2_ir=$(python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "puzzles-on"
          manifest = output / json.loads((output / "latest.json").read_text())["manifest"]
          entries = json.loads(manifest.read_text())["entries"]
          selected = [row for row in entries if row["entry"] == "chialisp_oxide_puzzles::p2_singleton::puzzle"]
          assert len(selected) == 1
          print(manifest.parent / selected[0]["ir"])
          PYTHON
          )
          target/debug/examples/p2_singleton_probe "$p2_ir" "$RUNNER_TEMP/p2-raw-domain"
      - name: Check the historical source-only P2 checkpoint
        run: |
          python3 -m unittest discover -s scripts -p test_p2_source_controls.py
          python3 -m unittest discover -s scripts -p test_p2_source_cost.py
          python3 scripts/check-p2-source-cost.py --self-test
          python3 -m unittest discover -s scripts -p test_source_cost_cli_options.py
      - name: Check historical guarded and composed compiler checkpoints
        run: |
          python3 -m unittest discover -s scripts -p test_runtime_guarded_projection.py
          python3 -m unittest discover -s scripts -p test_runtime_composition.py
      - name: Check the current corpus append before complete compiler history
        run: |
          python3 scripts/check-corpus-append.py --self-test --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
          python3 scripts/check-p2-delegated-conditions.py --self-test
          python3 scripts/check-p2dc-append.py --self-test
          python3 scripts/check-runtime-composition.py --self-test --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
          cargo build -p chialisp-oxide-simulator --example p2_singleton_cost --locked
          python3 scripts/check-p2-source-cost.py --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver --execute-costs --cost-runner target/debug/examples/p2_singleton_cost --execution-output "$RUNNER_TEMP/current-p2-cost-execution"
      - name: Execute complete generators with backreferences, BLS and cost-boundary controls
        run: |
          cargo fmt --manifest-path experiments/spend-costs/Cargo.toml --check
          cargo test --manifest-path experiments/spend-costs/Cargo.toml --locked --target-dir "$RUNNER_TEMP/spend-costs-target"
          cargo clippy --manifest-path experiments/spend-costs/Cargo.toml --all-targets --locked --target-dir "$RUNNER_TEMP/spend-costs-target" -- -D warnings
          cargo build --manifest-path experiments/spend-costs/Cargo.toml --locked --target-dir "$RUNNER_TEMP/spend-costs-target"
          python3 experiments/spend-costs/check.py --self-test --execute "$RUNNER_TEMP/spend-costs-target/debug/chialisp-oxide-spend-costs" --output "$RUNNER_TEMP/spend-costs-execution"
      - name: Preserve the signed baseline and replay measured cost improvements
        run: |
          python3 -m unittest discover -s scripts -p test_cost_optimization.py
          python3 -m unittest discover -s scripts -p test_helper_inlining.py
          python3 -m unittest discover -s scripts -p test_runtime_refinement.py
          python3 -m unittest discover -s scripts -p test_hashing_puzzles.py
          python3 scripts/check-cost-optimization.py --self-test --replay --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
          python3 scripts/check-helper-inlining.py --self-test --replay --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
          python3 scripts/check-runtime-refinement.py --self-test --replay --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
      - name: Check source-derived byte contracts and policy counterexamples
        run: |
          python3 scripts/test_cargo_bundle.py
          python3 scripts/test_cargo_source_receipt.py
          python3 scripts/check-byte-proofs.py --output "$RUNNER_TEMP/byte-proofs.json"
          python3 scripts/check-byte-proofs.py --output "$RUNNER_TEMP/byte-proofs.json" --check
          python3 scripts/check-byte-proofs.py --output "$RUNNER_TEMP/byte-proofs.json" --self-test
          python3 scripts/check-byte-proofs.py --compare "$RUNNER_TEMP/byte-proofs.json"
      - name: Check readable-source evidence and comparison controls
        run: |
          python3 scripts/check-readable-puzzles.py --self-test
          python3 -m unittest discover -s scripts -p test_ledger_components.py
          python3 scripts/check-readable-puzzles.py
          python3 scripts/check-runtime-frames.py --replay
          python3 scripts/check-runtime-frames.py --self-test
          python3 scripts/check-canonical-factories.py
          python3 scripts/check-canonical-factories.py --self-test
          python3 scripts/check-port-evidence.py --self-test --replay --cli target/debug/chialisp-oxide
          python3 scripts/cat_genesis_evidence.py --self-test
          python3 scripts/check-canonical-helpers.py
          python3 scripts/check-canonical-helpers.py --self-test
          python3 scripts/check-insertion-sort.py
          python3 scripts/check-insertion-sort.py --self-test
          python3 scripts/check-hashing-puzzles.py --self-test --replay
      - name: Check canonical password module and separate fixed-hash instances
        run: |
          python3 -m unittest discover -s scripts -p test_password_coin.py
          python3 scripts/check-password-coin.py --self-test --replay --extract-ir
      - name: Check actual Rust sources with the explicit acyclic scalar model
        run: |
          cargo fmt --manifest-path experiments/acyclic-scalar/Cargo.toml --all --check
          cargo clippy --manifest-path experiments/acyclic-scalar/Cargo.toml --all-targets --locked --offline --target-dir "$RUNNER_TEMP/acyclic-scalar-checks" -- -D warnings
          python3 scripts/check-acyclic-source.py --acyclic-scalar --execute --self-test \
            --tools target/debug \
            --target-dir "$RUNNER_TEMP/acyclic-scalar-target" \
            --output "$RUNNER_TEMP/acyclic-scalar-source"
      - name: Require committed validation data to match current compiler
        run: git diff --exit-code -- corpus/validation.json corpus/tree-proofs.json proofs/p2-conditions proofs/atom-not-equal
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p2dc-source-controls-linux
          path: |
            ${{ runner.temp }}/p2dc-source-package/
            ${{ runner.temp }}/p2dc-source-prepare.json
            ${{ runner.temp }}/p2dc-source-native/
            ${{ runner.temp }}/p2dc-source-last-host.json
            ${{ runner.temp }}/p2dc-source-capture/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-dependencies
          path: ${{ runner.temp }}/registry-dependencies/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-standard
          path: ${{ runner.temp }}/registry-standard/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-codegen
          path: ${{ runner.temp }}/registry-codegen/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-witness
          path: ${{ runner.temp }}/registry-witness/
      - uses: actions/upload-artifact@v7
        with:
          name: acyclic-scalar-source-evidence
          path: ${{ runner.temp }}/acyclic-scalar-source/
      - uses: actions/upload-artifact@v7
        with:
          name: p2-policy-counterexamples
          path: |
            ${{ runner.temp }}/current-p2-cost-execution/
            ${{ runner.temp }}/p2-policy-controls.json
            ${{ runner.temp }}/p2-policy-controls/
            ${{ runner.temp }}/p2-raw-domain/
            ${{ runner.temp }}/puzzles-on/
            ${{ runner.temp }}/puzzles-off/
      - uses: actions/upload-artifact@v7
        with:
          name: native-hash-evidence
          path: |
            ${{ runner.temp }}/hash-native.json
            ${{ runner.temp }}/hash-native-work/
      - uses: actions/upload-artifact@v7
        with:
          name: byte-proof-runner
          path: ${{ runner.temp }}/byte-proofs.json
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-validation
          path: |
            corpus/validation.json
            corpus/proofs.json
            corpus/error-study.json
            corpus/tree-proofs.json
            corpus/byte-proofs.json
            proofs/p2-conditions/
            proofs/atom-not-equal/
            proofs/bounded-counter/
            target/debug/chialisp-oxide
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-consumer-dependencies-compiler
          path: |
            ${{ runner.temp }}/offline-consumer-dependencies-prepare.json
            ${{ runner.temp }}/offline-consumer-dependencies/Cargo.toml
            ${{ runner.temp }}/offline-consumer-dependencies/Cargo.lock
  tree-theorems:
    needs: compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: compiler-validation
          path: ${{ runner.temp }}/compiler-validation
      - uses: actions/cache@v6
        id: lean-cache
        with:
          path: ${{ runner.temp }}/lean-4.35.0-linux
          key: lean-4.35.0-linux-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-pinned official Lean release
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          lean_archive="$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          curl --fail --location --retry 3 --output "$lean_archive" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$lean_archive" | sha256sum --check
          tar --zstd -xf "$lean_archive" -C "$RUNNER_TEMP"
          rm "$lean_archive"
      - name: Check finite-tree theorems, corruption controls and VM bridge
        run: |
          chmod u+x "$RUNNER_TEMP/compiler-validation/target/debug/chialisp-oxide"
          python3 experiments/tree-theorems/check-model.py \
            --lean "$RUNNER_TEMP/lean-4.35.0-linux/bin/lean" \
            --cli "$RUNNER_TEMP/compiler-validation/target/debug/chialisp-oxide" \
            --self-test --replay-vm --output "$RUNNER_TEMP/tree-theorems.json"
      - uses: actions/upload-artifact@v7
        with:
          name: tree-algorithm-evidence
          path: ${{ runner.temp }}/tree-theorems.json
  tests:
    # Workspace tests, consumer crates, the patched optimizer and Clippy run in
    # parallel with the evidence gates; Pages deployment waits for every job.
    # The verifier tests invoke the same pinned Z3 release as the evidence job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install checksum-pinned Z3 4.15.4
        run: |
          z3_archive="$RUNNER_TEMP/z3-4.15.4-x64-glibc-2.39.zip"
          z3_directory="$RUNNER_TEMP/z3-4.15.4-x64-glibc-2.39"
          curl --fail --location --retry 3 --output "$z3_archive" https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-glibc-2.39.zip
          printf '%s  %s\n' 'a41b690e89c343931471506cdc6d957b6044a200fd2d240cc017432afdff7d3e' "$z3_archive" | sha256sum --check --strict
          python3 - "$z3_archive" "$RUNNER_TEMP" <<'PYTHON'
          from pathlib import Path
          import sys
          import zipfile
          destination = Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(destination)
          binary = destination / "z3-4.15.4-x64-glibc-2.39/bin/z3"
          if not binary.is_file():
              raise RuntimeError("The pinned Z3 archive is missing its CLI binary")
          binary.chmod(0o755)
          PYTHON
          z3_version="$("$z3_directory/bin/z3" --version)"
          printf '%s\n' "$z3_version"
          test "$z3_version" = 'Z3 version 4.15.4 - 64 bit'
          printf '%s\n' "$z3_directory/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust and compiler components
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-tests-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-tests-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Populate dependencies for fresh offline Cargo consumers
        run: |
          # These disposable consumers resolve separately from the workspace lock.
          # Populate their registry cache before the actual offline evidence/tests.
          python3 -B scripts/run-precommit-source-controls.py prepare \
            --package "$RUNNER_TEMP/offline-consumer-dependencies" \
            --receipt "$RUNNER_TEMP/offline-consumer-dependencies-prepare.json"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/offline-consumer-dependencies/Cargo.toml"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/offline-consumer-dependencies/Cargo.toml"
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - name: Check ordinary Cargo consumer crates
        run: |
          cargo test --manifest-path examples/cargo-puzzles/Cargo.toml --locked
          cargo test --manifest-path examples/cargo-puzzles/Cargo.toml --features strict-cap --locked
          cargo test --manifest-path examples/cargo-invalid/Cargo.toml --locked
      - name: Test patched upstream optimizer
        run: cargo test --locked -p rue-lir@0.11.0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-consumer-dependencies-tests
          path: |
            ${{ runner.temp }}/offline-consumer-dependencies-prepare.json
            ${{ runner.temp }}/offline-consumer-dependencies/Cargo.toml
            ${{ runner.temp }}/offline-consumer-dependencies/Cargo.lock
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: www/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm --dir www install --frozen-lockfile
      - run: pnpm --dir www check
      - run: pnpm --dir www build
      - run: pnpm --dir www test:site
