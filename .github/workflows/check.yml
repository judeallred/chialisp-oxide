name: Compiler and verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned Z3 4.15.4
        run: |
          z3_archive="$RUNNER_TEMP/z3-4.15.4-x64-glibc-2.39.zip"
          z3_directory="$RUNNER_TEMP/z3-4.15.4-x64-glibc-2.39"
          curl --fail --location --retry 3 --output "$z3_archive" https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-glibc-2.39.zip
          printf '%s  %s\n' 'a41b690e89c343931471506cdc6d957b6044a200fd2d240cc017432afdff7d3e' "$z3_archive" | sha256sum --check --strict
          python3 - "$z3_archive" "$RUNNER_TEMP" <<'PYTHON'
          from pathlib import Path
          import sys
          import zipfile
          destination = Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(destination)
          binary = destination / "z3-4.15.4-x64-glibc-2.39/bin/z3"
          if not binary.is_file():
              raise RuntimeError("The pinned Z3 archive is missing its CLI binary")
          binary.chmod(0o755)
          PYTHON
          z3_version="$("$z3_directory/bin/z3" --version)"
          printf '%s\n' "$z3_version"
          test "$z3_version" = 'Z3 version 4.15.4 - 64 bit'
          printf '%s\n' "$z3_directory/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust and compiler components
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Check ordinary Cargo consumer crates
        run: |
          cargo test --manifest-path examples/cargo-puzzles/Cargo.toml --locked
          cargo test --manifest-path examples/cargo-puzzles/Cargo.toml --features strict-cap --locked
          cargo test --manifest-path examples/cargo-invalid/Cargo.toml --locked
      - name: Test patched upstream optimizer
        run: cargo test --locked -p rue-lir@0.11.0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Execute actual SDK SHA against native known answers and OpenSSL
        run: |
          python3 experiments/hash-native/check-native.py --work-dir "$RUNNER_TEMP/hash-native-work" --output "$RUNNER_TEMP/hash-native.json" --self-test
          python3 experiments/hash-native/check-native.py --output "$RUNNER_TEMP/hash-native.json" --check --self-test
      - name: Check VM failure and consensus rejection protocols
        run: |
          python3 scripts/vm_failures.py
          python3 scripts/ledger_rejections.py
      - run: python3 corpus/validate_inventory.py
      - name: Check published puzzle discovery and provenance controls
        run: python3 corpus/validate_published_puzzles.py --self-test
      - name: Reproduce compiler error studies and missed-test counterexamples
        run: |
          python3 scripts/check-error-study.py
          python3 scripts/check-error-study.py --self-test
      - name: Check pinned tutorial examples and inventory controls
        run: |
          python3 corpus/validate_tutorial_examples.py
          python3 corpus/validate_tutorial_examples.py --self-test
      - run: python3 scripts/check-proofs.py
      - name: Check canonical integer byte model and counterexamples
        run: |
          python3 -m unittest discover -s scripts -p test_integer_canonicality.py
          python3 scripts/check-integer-canonicality.py --check --self-test
      - name: Derive and check proofs from Rust source
        run: |
          python3 scripts/check-ir-proofs.py --output corpus/proofs.json
          python3 scripts/check-ir-proofs.py --self-test
      - name: Check structural raw-tree specification and replay mutants
        run: |
          python3 scripts/check-tree-proofs.py --output corpus/tree-proofs.json
          python3 scripts/check-tree-proofs.py --self-test
      - name: Validate Rust, Chialisp, native execution, and complete spends reproducibly
        run: |
          target/debug/chialisp-oxide validate --output corpus/validation.json
          target/debug/chialisp-oxide validate --output "$RUNNER_TEMP/validation-repeat.json"
          cmp corpus/validation.json "$RUNNER_TEMP/validation-repeat.json"
      - name: Check canonical pay-to-singleton and actual Rust policy mutations
        run: |
          python3 -m unittest discover -s scripts -p test_p2_append_migration.py
          python3 -m unittest discover -s scripts -p test_p2_singleton_evidence.py
          python3 -m unittest discover -s scripts -p test_p2_outer_integration.py
          python3 scripts/check-p2-singleton.py --self-test
          cargo test --manifest-path experiments/p2-singleton-controls/Cargo.toml --locked
          cargo clippy --manifest-path experiments/p2-singleton-controls/Cargo.toml --all-targets --locked -- -D warnings
          cargo build -p chialisp-oxide-corpus --examples --locked
          target/debug/cargo-chialisp-oxide build --locked --manifest-path experiments/p2-singleton-controls/Cargo.toml --output-dir "$RUNNER_TEMP/p2-policy-controls"
          python3 scripts/check-p2-source-controls.py --bundle "$RUNNER_TEMP/p2-policy-controls" --driver target/debug/chialisp-oxide-driver --self-test
          target/debug/examples/p2_singleton_controls "$RUNNER_TEMP/p2-policy-controls" "$RUNNER_TEMP/p2-policy-controls.json"
      - name: Extract fresh complete Cargo bundles in both modes
        run: |
          target/debug/cargo-chialisp-oxide build --manifest-path puzzles/Cargo.toml --package chialisp-oxide-puzzles --locked --output-dir "$RUNNER_TEMP/puzzles-on"
          target/debug/cargo-chialisp-oxide build --manifest-path puzzles/Cargo.toml --package chialisp-oxide-puzzles --locked --no-optimize --output-dir "$RUNNER_TEMP/puzzles-off"
      - name: Execute P2 raw-domain and separate resource controls
        run: |
          p2_ir=$(python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "puzzles-on"
          manifest = output / json.loads((output / "latest.json").read_text())["manifest"]
          entries = json.loads(manifest.read_text())["entries"]
          selected = [row for row in entries if row["entry"] == "chialisp_oxide_puzzles::p2_singleton::puzzle"]
          assert len(selected) == 1
          print(manifest.parent / selected[0]["ir"])
          PYTHON
          )
          target/debug/examples/p2_singleton_probe "$p2_ir" "$RUNNER_TEMP/p2-raw-domain"
      - name: Preserve the signed baseline and replay measured cost improvements
        run: |
          python3 -m unittest discover -s scripts -p test_cost_optimization.py
          python3 -m unittest discover -s scripts -p test_helper_inlining.py
          python3 -m unittest discover -s scripts -p test_runtime_refinement.py
          python3 -m unittest discover -s scripts -p test_hashing_puzzles.py
          python3 scripts/check-cost-optimization.py --self-test --replay --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
          python3 scripts/check-helper-inlining.py --self-test --replay --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
          python3 scripts/check-runtime-refinement.py --self-test --replay --fresh-on "$RUNNER_TEMP/puzzles-on" --fresh-off "$RUNNER_TEMP/puzzles-off" --driver target/debug/chialisp-oxide-driver
      - name: Check source-derived byte contracts and policy counterexamples
        run: |
          python3 scripts/test_cargo_bundle.py
          python3 scripts/check-byte-proofs.py --output "$RUNNER_TEMP/byte-proofs.json"
          python3 scripts/check-byte-proofs.py --output "$RUNNER_TEMP/byte-proofs.json" --check
          python3 scripts/check-byte-proofs.py --output "$RUNNER_TEMP/byte-proofs.json" --self-test
          python3 scripts/check-byte-proofs.py --compare "$RUNNER_TEMP/byte-proofs.json"
      - name: Check readable-source evidence and comparison controls
        run: |
          python3 scripts/check-readable-puzzles.py --self-test
          python3 scripts/check-readable-puzzles.py
          python3 scripts/check-runtime-frames.py --replay
          python3 scripts/check-runtime-frames.py --self-test
          python3 scripts/check-canonical-factories.py
          python3 scripts/check-canonical-factories.py --self-test
          python3 scripts/check-canonical-helpers.py
          python3 scripts/check-canonical-helpers.py --self-test
          python3 scripts/check-insertion-sort.py
          python3 scripts/check-insertion-sort.py --self-test
          python3 scripts/check-hashing-puzzles.py --self-test --replay
      - name: Check canonical password module and separate fixed-hash instances
        run: |
          python3 -m unittest discover -s scripts -p test_password_coin.py
          python3 scripts/check-password-coin.py --self-test --replay --extract-ir
      - name: Check actual Rust sources with the explicit acyclic scalar model
        run: |
          cargo fmt --manifest-path experiments/acyclic-scalar/Cargo.toml --all --check
          cargo clippy --manifest-path experiments/acyclic-scalar/Cargo.toml --all-targets --locked --offline --target-dir "$RUNNER_TEMP/acyclic-scalar-checks" -- -D warnings
          python3 scripts/check-acyclic-source.py --acyclic-scalar --execute --self-test \
            --tools target/debug \
            --target-dir "$RUNNER_TEMP/acyclic-scalar-target" \
            --output "$RUNNER_TEMP/acyclic-scalar-source"
      - name: Require committed validation data to match current compiler
        run: git diff --exit-code -- corpus/validation.json corpus/tree-proofs.json proofs/p2-conditions proofs/atom-not-equal
      - uses: actions/upload-artifact@v4
        with:
          name: acyclic-scalar-source-evidence
          path: ${{ runner.temp }}/acyclic-scalar-source/
      - uses: actions/upload-artifact@v4
        with:
          name: p2-policy-counterexamples
          path: |
            ${{ runner.temp }}/p2-policy-controls.json
            ${{ runner.temp }}/p2-policy-controls/
            ${{ runner.temp }}/p2-raw-domain/
            ${{ runner.temp }}/puzzles-on/
            ${{ runner.temp }}/puzzles-off/
      - uses: actions/upload-artifact@v4
        with:
          name: native-hash-evidence
          path: |
            ${{ runner.temp }}/hash-native.json
            ${{ runner.temp }}/hash-native-work/
      - uses: actions/upload-artifact@v4
        with:
          name: byte-proof-runner
          path: ${{ runner.temp }}/byte-proofs.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-validation
          path: |
            corpus/validation.json
            corpus/proofs.json
            corpus/error-study.json
            corpus/tree-proofs.json
            corpus/byte-proofs.json
            proofs/p2-conditions/
            proofs/atom-not-equal/
            proofs/bounded-counter/
            target/debug/chialisp-oxide
  tree-theorems:
    needs: compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiler-validation
          path: ${{ runner.temp }}/compiler-validation
      - uses: actions/cache@v4
        id: lean-cache
        with:
          path: ${{ runner.temp }}/lean-4.35.0-linux
          key: lean-4.35.0-linux-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-pinned official Lean release
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          lean_archive="$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          curl --fail --location --retry 3 --output "$lean_archive" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$lean_archive" | sha256sum --check
          tar --zstd -xf "$lean_archive" -C "$RUNNER_TEMP"
          rm "$lean_archive"
      - name: Check finite-tree theorems, corruption controls and VM bridge
        run: |
          chmod u+x "$RUNNER_TEMP/compiler-validation/target/debug/chialisp-oxide"
          python3 experiments/tree-theorems/check-model.py \
            --lean "$RUNNER_TEMP/lean-4.35.0-linux/bin/lean" \
            --cli "$RUNNER_TEMP/compiler-validation/target/debug/chialisp-oxide" \
            --self-test --replay-vm --output "$RUNNER_TEMP/tree-theorems.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tree-algorithm-evidence
          path: ${{ runner.temp }}/tree-theorems.json
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: www/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm --dir www install --frozen-lockfile
      - run: pnpm --dir www check
      - run: pnpm --dir www build
      - run: pnpm --dir www test:site
