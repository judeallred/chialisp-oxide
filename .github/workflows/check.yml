name: Compiler and verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install solver
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Install pinned Rust and compiler components
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Check ordinary Cargo consumer crates
        run: |
          cargo test --manifest-path examples/cargo-puzzles/Cargo.toml --locked
          cargo test --manifest-path examples/cargo-puzzles/Cargo.toml --features strict-cap --locked
          cargo test --manifest-path examples/cargo-invalid/Cargo.toml --locked
      - name: Test patched upstream optimizer
        run: cargo test --locked -p rue-lir@0.11.0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 corpus/validate_inventory.py
      - run: python3 scripts/check-proofs.py
      - name: Derive and check proofs from Rust source
        run: python3 scripts/check-ir-proofs.py --output corpus/proofs.json
      - name: Validate Rust, Chialisp, native execution, and complete spends
        run: target/debug/oxide validate --output corpus/validation.json
      - name: Check readable-source evidence and comparison controls
        run: |
          python3 scripts/check-readable-puzzles.py --self-test
          python3 scripts/check-readable-puzzles.py
      - name: Require committed validation data to match current compiler
        run: git diff --exit-code -- corpus/validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-validation
          path: |
            corpus/validation.json
            corpus/proofs.json
            proofs/bounded-counter/
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: www/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm --dir www install --frozen-lockfile
      - run: pnpm --dir www check
      - run: pnpm --dir www build
      - run: pnpm --dir www test:site
