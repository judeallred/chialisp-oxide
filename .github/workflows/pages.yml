name: Deploy documentation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Compiler and verification"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require successful compiler verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          verified_runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs" -f head_sha="$VERIFIED_SHA" -f branch=main -f event=push -f status=success --jq '.total_count')
          test "$verified_runs" -gt 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: www/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm --dir www install --frozen-lockfile
      - run: pnpm --dir www check
      - run: pnpm --dir www build
      - run: pnpm --dir www test:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www/dist
          # Retained evidence includes provenance dotfiles such as .cargo_vcs_info.json.
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
